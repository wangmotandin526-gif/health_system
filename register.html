<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - HealthSys</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>


<div class="container">
    <div class="login-container">

        <div class="card login-card">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">

                    <div class="logo-icon mb-3">
                        <i class="bi bi-heart-pulse"></i>
                    </div>

                    <h3 class="fw-bold mb-1">
                        HealthSys
                    </h3>

                    <p class="text-muted">
                        IT Health Management System
                    </p>

                </div>

                <div class="mb-4">
                    <h4 class="fw-bold">
                        Create Your Account
                    </h4>

                    <p class="text-muted mb-0">
                        Sign up as a patient to book appointments and view your records.
                    </p>
                </div>

                <div id="registerError" class="alert alert-danger d-none" role="alert"></div>
                <div id="registerSuccess" class="alert alert-success d-none" role="alert"></div>

                <form id="registerForm">

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Full Name
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input
                                type="text"
                                id="fullName"
                                class="form-control"
                                placeholder="Enter your full name"
                                maxlength="100"
                                required
                            >

                        </div>

                    </div>
                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Email Address
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-envelope"></i>
                            </span>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter your email"
                                maxlength="254"
                                required
                            >

                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-semibold">
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="At least 8 characters"
                                minlength="8"
                                maxlength="128"
                                required
                            >

                        </div>

                    </div>
                    <div class="mb-4">

                        <label class="form-label fw-semibold">
                            Confirm Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>

                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control"
                                placeholder="Re-enter your password"
                                minlength="8"
                                maxlength="128"
                                required
                            >

                        </div>

                    </div>
                    <div class="d-grid">

                        <button
                            type="submit"
                            id="registerBtn"
                            class="btn btn-primary login-btn"
                        >
                            <i class="bi bi-person-plus me-2"></i>
                            Create Account
                        </button>

                    </div>

                </form>
                <div class="text-center mt-4">

                    <p class="text-muted mb-0">
                        Already have an account?
                        <a href="login.html" class="text-decoration-none fw-semibold">
                            Login
                        </a>
                    </p>

                </div>

            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const fullName = document.getElementById('fullName').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorBox = document.getElementById('registerError');
    const successBox = document.getElementById('registerSuccess');
    const btn = document.getElementById('registerBtn');

    errorBox.classList.add('d-none');
    successBox.classList.add('d-none');

    if (password.length < 8) {
        errorBox.textContent = 'Password must be at least 8 characters.';
        errorBox.classList.remove('d-none');
        return;
    }
    if (password !== confirmPassword) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.classList.remove('d-none');
        return;
    }

    btn.disabled = true;
    btn.innerHTML = 'Creating account...';

    try {
        // /api/auth/register always creates a 'patient' account -- there's
        // no role field to set here, by design (staff accounts are created
        // separately by an admin via /api/auth/register-staff).
        await Auth.apiFetch('/api/auth/register', {
            method: 'POST',
            body: JSON.stringify({ full_name: fullName, email, password }),
        });

        successBox.textContent = 'Account created! Redirecting to login...';
        successBox.classList.remove('d-none');
        document.getElementById('registerForm').reset();
        setTimeout(() => { window.location.href = 'login.html'; }, 1500);
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Create Account';
    }
});
</script>

</body>
</html>
