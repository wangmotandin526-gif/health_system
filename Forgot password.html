<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - HealthSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="login-container">
        <div class="card login-card">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <div class="logo-icon mb-3"><i class="bi bi-key"></i></div>
                    <h3 class="fw-bold mb-1">Forgot your password?</h3>
                    <p class="text-muted">
                        Enter the email on your account and we'll generate a reset link for it.
                    </p>
                </div>

                <div id="formError" class="alert alert-danger d-none" role="alert"></div>
                <div id="formResult" class="d-none"></div>

                <form id="forgotForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" id="submitBtn" class="btn btn-primary login-btn">
                            <i class="bi bi-send me-2"></i>Send Reset Link
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted mb-0">
                        Remembered it? <a href="login.html" class="text-decoration-none fw-semibold">Back to login</a>
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const errorBox = document.getElementById('formError');
    const resultBox = document.getElementById('formResult');
    const btn = document.getElementById('submitBtn');

    errorBox.classList.add('d-none');
    resultBox.classList.add('d-none');
    btn.disabled = true;
    btn.textContent = 'Sending...';

    try {
        const res = await Auth.apiFetch('/api/auth/forgot-password', {
            method: 'POST',
            body: JSON.stringify({ email }),
        });

        // This project has no email server wired up, so instead of emailing
        // a reset link, the backend hands the token back here and we build
        // the link for the demo. In production, this block would not exist
        // -- the user would just be told to check their inbox.
        if (res.data && res.data.resetToken) {
            const resetUrl = `reset-password.html?token=${encodeURIComponent(res.data.resetToken)}`;
            resultBox.innerHTML = `
                <div class="alert alert-success">
                    <p class="mb-2">${Auth.escapeHtml(res.message)}</p>
                    <p class="mb-2 small">No email server is configured for this demo, so here is your one-time reset link (valid 30 minutes):</p>
                    <a href="${resetUrl}" class="btn btn-sm btn-success">Reset my password</a>
                </div>`;
        } else {
            resultBox.innerHTML = `<div class="alert alert-success">${Auth.escapeHtml(res.message)}</div>`;
        }
        resultBox.classList.remove('d-none');
        document.getElementById('forgotForm').reset();
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('d-none');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-send me-2"></i>Send Reset Link';
    }
});
</script>

</body>
</html>
