<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - HealthSys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="login-container">
        <div class="card login-card">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <div class="logo-icon mb-3"><i class="bi bi-shield-lock"></i></div>
                    <h3 class="fw-bold mb-1">Choose a new password</h3>
                    <p class="text-muted">Your reset link is valid for 30 minutes and can only be used once.</p>
                </div>

                <div id="formError" class="alert alert-danger d-none" role="alert"></div>
                <div id="formSuccess" class="alert alert-success d-none" role="alert"></div>

                <form id="resetForm">
                    <input type="hidden" id="token">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <input type="password" id="newPassword" class="form-control" minlength="8" required>
                        <div class="form-text">At least 8 characters.</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Confirm New Password</label>
                        <input type="password" id="confirmPassword" class="form-control" minlength="8" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" id="submitBtn" class="btn btn-primary login-btn">
                            <i class="bi bi-check-lg me-2"></i>Reset Password
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted mb-0">
                        <a href="login.html" class="text-decoration-none fw-semibold">Back to login</a>
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token') || '';
document.getElementById('token').value = token;

if (!token) {
    document.getElementById('formError').textContent = 'This link is missing its reset token. Request a new one from the Forgot Password page.';
    document.getElementById('formError').classList.remove('d-none');
    document.getElementById('resetForm').querySelector('button').disabled = true;
}

document.getElementById('resetForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const errorBox = document.getElementById('formError');
    const successBox = document.getElementById('formSuccess');
    const btn = document.getElementById('submitBtn');

    errorBox.classList.add('d-none');
    successBox.classList.add('d-none');

    if (newPassword.length < 8) {
        errorBox.textContent = 'Password must be at least 8 characters.';
        errorBox.classList.remove('d-none');
        return;
    }
    if (newPassword !== confirmPassword) {
        errorBox.textContent = 'Passwords do not match.';
        errorBox.classList.remove('d-none');
        return;
    }

    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
        const res = await Auth.apiFetch('/api/auth/reset-password', {
            method: 'POST',
            body: JSON.stringify({ token: document.getElementById('token').value, new_password: newPassword }),
        });
        successBox.textContent = res.message;
        successBox.classList.remove('d-none');
        document.getElementById('resetForm').reset();
        document.getElementById('resetForm').querySelector('button').disabled = true;
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check-lg me-2"></i>Reset Password';
    }
});
</script>

</body>
</html>
